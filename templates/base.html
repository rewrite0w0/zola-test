<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyBlog</title>
  <style>
    #ad-note-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #ad-note-box {
      background: #111111;
      color: white;
      border: white 1px solid;
      padding: 1.5em;
      max-width: 20em;
      text-align: center;
    }
    #ad-note-box button {
      margin: 0.5em;
      padding: 0.5em 1em;
      cursor: pointer;
    }
    /* 검색 결과 스타일 추가 추천 */
    #search-results {
      list-style: none;
      padding: 0;
      margin: 0.5em 0 0;
    }
    #search-results li {
      margin: 0.3em 0;
    }
  </style>
</head>

<body>
  <!-- 검색창을 원하는 위치(헤더 등)에 넣으세요 -->
  <div id="search-container">
    <input id="search-box" type="text" placeholder="검색...">
    <ul id="search-results"></ul>
  </div>

  <section class="section">
    <div class="container">
      {% block content %} {% endblock content %}
    </div>
  </section>

  <!-- 광고 관련 코드는 그대로 -->
  <script defer src="{{ get_url(path='nativeads.js') }}"></script>
  <div id="ad-sensor" class="ad native-ad ad-banner adsbygoogle ad-container advertisement blocker-notice"
       style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;"></div>

  <div id="ad-note-modal">
    <div id="ad-note-box">
      <p>광고 차단기가 감지되지 않았습니다.<br>uBlock Origin을 설치하면 더 빠르고 안전하게 인터넷을 쓸 수 있어요.</p>
      <button id="ad-note-ok">OK</button>
      <button id="ad-note-install">설치하러 가기</button>
    </div>
  </div>

<!-- head나 body 아무 데나 -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<script>
  let fuse = null;

  async function loadSearch() {
    try {
      const res = await fetch("{{ get_url(path='search_index.en.json') }}");
      const data = await res.json();

      // Fuse 옵션 (한글에 잘 맞는 설정)
      const options = {
        keys: [
          { name: "title", weight: 2 },
          { name: "body", weight: 1 }
        ],
        threshold: 0.4,          // 0에 가까울수록 엄격, 1에 가까울수록 느슨
        ignoreLocation: true,
        includeScore: true,
        minMatchCharLength: 1
      };

      fuse = new Fuse(data, options);
      console.log("Fuse search ready");
    } catch (e) {
      console.error("Search load failed:", e);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadSearch();

    const searchBox = document.getElementById("search-box");
    const resultsList = document.getElementById("search-results");

    searchBox.addEventListener("input", (e) => {
      const query = e.target.value.trim();
      resultsList.innerHTML = "";

      if (!fuse || query.length < 1) return;

      const results = fuse.search(query).slice(0, 10);

      results.forEach(result => {
        const item = result.item;
        const li = document.createElement("li");
        li.innerHTML = `<a href="${item.url || item.permalink || item.path}">${item.title}</a>`;
        resultsList.appendChild(li);
      });
    });
  });
</script>
</body>
</html>
