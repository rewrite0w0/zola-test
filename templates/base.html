<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyBlog</title>
  <style>
    #ad-note-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #ad-note-box {
      background: #111111;
      color: white;
      border: white 1px solid;
      padding: 1.5em;
      max-width: 20em;
      text-align: center;
    }
    #ad-note-box button {
      margin: 0.5em;
      padding: 0.5em 1em;
      cursor: pointer;
    }
    /* 검색 결과 스타일 추가 추천 */
    #search-results {
      list-style: none;
      padding: 0;
      margin: 0.5em 0 0;
    }
    #search-results li {
      margin: 0.3em 0;
    }
  </style>
</head>

<body>
  <!-- 검색창을 원하는 위치(헤더 등)에 넣으세요 -->
  <div id="search-container">
    <input id="search-box" type="text" placeholder="검색...">
    <ul id="search-results"></ul>
  </div>

  <section class="section">
    <div class="container">
      {% block content %} {% endblock content %}
    </div>
  </section>

  <!-- 광고 관련 코드는 그대로 -->
  <script defer src="{{ get_url(path='nativeads.js') }}"></script>
  <div id="ad-sensor" class="ad native-ad ad-banner adsbygoogle ad-container advertisement blocker-notice"
       style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;"></div>

  <div id="ad-note-modal">
    <div id="ad-note-box">
      <p>광고 차단기가 감지되지 않았습니다.<br>uBlock Origin을 설치하면 더 빠르고 안전하게 인터넷을 쓸 수 있어요.</p>
      <button id="ad-note-ok">OK</button>
      <button id="ad-note-install">설치하러 가기</button>
    </div>
  </div>

  <!-- 검색 스크립트는 body 맨 아래에 -->
  <script src="{{ get_url(path='elasticlunr.min.js') }}"></script>
  <script>
    let searchIndex = null;

    async function loadIndex() {
      try {
        const res = await fetch("{{ get_url(path='search_index.en.json') }}");
        if (!res.ok) throw new Error("index 로드 실패: " + res.status);
        const data = await res.json();
        searchIndex = elasticlunr.Index.load(data);
        console.log("Search index loaded");
      } catch (e) {
        console.error("Search index error:", e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadIndex();

      const searchBox = document.getElementById('search-box');
      const resultsList = document.getElementById('search-results');

      searchBox.addEventListener('input', function (e) {
        const query = e.target.value.trim();
        resultsList.innerHTML = '';

        if (!searchIndex || query.length < 2) return;

        const results = searchIndex.search(query, {
          expand: true,
          bool:"OR",
          fields: {
            title: { boost: 3 },
            body: { boost: 1 }
          }
        });

        results.slice(0, 10).forEach(result => {
          const doc = searchIndex.documentStore.getDoc(result.ref);
          const li = document.createElement('li');
          li.innerHTML = `<a href="${result.ref}">${doc.title || result.ref}</a>`;
          resultsList.appendChild(li);
        });
      });
    });
  </script>
</body>
</html>
